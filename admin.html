<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <title>Admin Dashboard - GearVN</title>
        <!-- Nhúng Bootstrap 5 và FontAwesome -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <style>
            /* Tận dụng màu sắc từ layout User của bạn */
            .bg-gear-red {
                background-color: #d70018 !important;
            }
            .sidebar {
                min-height: 100vh;
                background-color: #212529;
                color: #fff;
            }
            .sidebar a {
                color: #adb5bd;
                text-decoration: none;
                padding: 10px 20px;
                display: block;
            }
            .sidebar a:hover,
            .sidebar a.active {
                color: #fff;
                background-color: #d70018;
            }
        </style>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <!-- SIDEBAR BÊN TRÁI -->
                <div class="col-md-3 col-lg-2 sidebar p-0">
                    <div class="p-3 text-center bg-dark border-bottom border-secondary">
                        <h4 class="text-white m-0">
                            <span style="color: #d70018">Gear</span>VN Admin
                        </h4>
                    </div>
                    <ul class="nav flex-column mt-2">
                        <li class="nav-item">
                            <a href="#" class="active"
                                ><i class="fas fa-home me-2"></i> Tổng quan</a
                            >
                        </li>
                        <li class="nav-item">
                            <a href="#"><i class="fas fa-box me-2"></i> Quản lý sản phẩm</a>
                        </li>
                        <li class="nav-item">
                            <a href="#"><i class="fas fa-list me-2"></i> Quản lý danh mục</a>
                        </li>
                        <li class="nav-item">
                            <a href="#"
                                ><i class="fas fa-shopping-cart me-2"></i> Quản lý đơn hàng</a
                            >
                        </li>
                        <li class="nav-item">
                            <a href="#"><i class="fas fa-users me-2"></i> Quản lý tài khoản</a>
                        </li>
                    </ul>
                </div>

                <!-- NỘI DUNG CHÍNH BÊN PHẢI -->
                <div class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
                    <!-- Header Admin -->
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom"
                    >
                        <h1 class="h2">Quản lý sản phẩm</h1>
                        <div class="btn-toolbar mb-2 mb-md-0">
                            <span class="me-3 align-self-center"
                                >Xin chào, <strong>Admin</strong></span
                            >
                            <a href="#" class="btn btn-sm btn-outline-danger">Đăng xuất</a>
                        </div>
                    </div>

                    <!-- Khu vực hiển thị bảng dữ liệu (Ví dụ danh sách sản phẩm) -->
                    <div class="card shadow-sm">
                        <div
                            class="card-header bg-white d-flex justify-content-between align-items-center"
                        >
                            <h5 class="mb-0">Danh sách laptop</h5>
                            <button class="btn btn-sm btn-danger bg-gear-red">
                                <i class="fas fa-plus me-1"></i> Thêm sản phẩm mới
                            </button>
                        </div>
                        <div class="card-body">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Tên sản phẩm</th>
                                        <th>Danh mục</th>
                                        <th>Giá bán</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>1</td>
                                        <td>Laptop Gaming Acer Nitro</td>
                                        <td>Laptop</td>
                                        <td>20,990,000 đ</td>
                                        <td>
                                            <button class="btn btn-sm btn-warning text-white">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <button class="btn btn-sm btn-danger">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <!-- Các dòng dữ liệu khác -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
